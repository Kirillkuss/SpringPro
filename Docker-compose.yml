version: '3.4'

volumes:
  pg_project:

services:
  springpro:
    image: springpro
    ports:
      - "8085:8085"
    build:
      context: .
    container_name: springpro
    
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
